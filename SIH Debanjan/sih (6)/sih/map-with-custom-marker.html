<!DOCTYPE html>
<html>
<head>
    <title>OpenStreetMap with Custom Marker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .custom-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: red;
            border: 3px solid white;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 0, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <script>
        // Initialize the map
        const map = L.map('map').setView([20.5937, 78.9629], 5); // Default center on India
        
        // Add the OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Create a custom icon for the marker
        const customIcon = L.divIcon({
            className: 'custom-marker pulse',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });
        
        // Add a marker with the custom icon
        const marker = L.marker([20.5937, 78.9629], { icon: customIcon }).addTo(map);
        marker.bindPopup("<b>Custom Location</b><br>Click to set your coordinates").openPopup();
        
        // Function to update marker position on map click
        function onMapClick(e) {
            marker.setLatLng(e.latlng);
            marker.bindPopup("<b>Selected Location</b><br>Latitude: " + e.latlng.lat.toFixed(5) + 
                            "<br>Longitude: " + e.latlng.lng.toFixed(5)).openPopup();
            
            // You can use these coordinates for further processing
            console.log("Selected coordinates:", e.latlng.lat, e.latlng.lng);
            
            // Uncomment below if you want to trigger an event or update a form
            // document.getElementById('latitude').value = e.latlng.lat;
            // document.getElementById('longitude').value = e.latlng.lng;
        }
        
        // Add click event listener to the map
        map.on('click', onMapClick);
    </script>
</body>
</html>
